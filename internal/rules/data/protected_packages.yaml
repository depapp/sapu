# Packages Sapu never uninstalls or disables, whatever the user selects.
# Exact names or prefixes (ending in "."). Data only; the policy lives in rules.go.
# Sources: AOSP core, Google Play services, OEM launchers/dialers/settings.
# Add an entry with the reason; a phone that does not boot is not recoverable from a CLI.
exact:
  - android
  - com.android.vending            # Play Store
  - com.google.android.gms          # Play services
  - com.google.android.gsf
  - com.google.android.webview
  - com.google.android.trichromelibrary
  - com.google.android.packageinstaller
  - com.google.android.permissioncontroller
  - com.google.android.ext.services
  - com.google.android.ext.shared
  - com.google.android.inputmethod.latin   # Gboard: removing the only keyboard locks the user out
  - com.google.android.dialer
  - com.google.android.contacts
  - com.google.android.apps.messaging
  - com.google.android.apps.nexuslauncher
  - com.google.android.setupwizard
  - com.google.android.gms.supervision
  # Pixel / Google system pieces found by `sapu probe` on an Android 14 image.
  - com.google.android.as                 # Android System Intelligence (Live Caption, Now Playing, smart text)
  - com.google.android.as.oss
  - com.google.android.bluetooth
  - com.google.android.sdksandbox
  - com.google.android.ondevicepersonalization.services
  - com.google.android.federatedcompute
  - com.google.android.connectivity.resources
  - com.google.android.connectivity.resources.goldfish.overlay
  - com.google.android.uwb.resources
  - com.google.android.telephony.satellite
