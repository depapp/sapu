# Preinstalled apps that are safe to remove for the current user (pm uninstall --user 0).
# "pm uninstall -k --user 0" keeps the APK on the system partition, so the app can be
# restored with "cmd package install-existing <package>", which `sapu uninstall` offers.
# risk: safe (no system function depends on it) | medium (a feature the user may rely on).
# note_id: optional Indonesian note; omitted when the note is just an app name.
# Seeded from publicly known lists (Universal Android Debloater, OEM forums); every row
# still needs confirmation from real phones. Open an issue with `sapu probe` output.
