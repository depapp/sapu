name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify tag matches source version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          grep -q "var Version = \"$tag\"" main.go || { echo "main.go Version does not match tag $tag"; exit 1; }
          grep -q "versionName = \"$tag\"" android/app/build.gradle.kts || { echo "android versionName does not match tag $tag"; exit 1; }
      - name: Build
        run: |
          set -e
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME#v}" -o "dist/sapu-$os-$arch$ext" .
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/*
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: android sdk
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: Decode keystore
        env:
          SAPU_KEYSTORE_BASE64: ${{ secrets.SAPU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SAPU_KEYSTORE_BASE64" ]; then
            echo "::error::Release APK must be signed. Add the SAPU_KEYSTORE_BASE64, SAPU_KEYSTORE_PASSWORD, SAPU_KEY_ALIAS and SAPU_KEY_PASSWORD repository secrets (see android/README.md)."
            exit 1
          fi
          echo "$SAPU_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sapu.jks"
      - name: Build release APK
        working-directory: android
        env:
          SAPU_KEYSTORE_FILE: ${{ runner.temp }}/sapu.jks
          SAPU_KEYSTORE_PASSWORD: ${{ secrets.SAPU_KEYSTORE_PASSWORD }}
          SAPU_KEY_ALIAS: ${{ secrets.SAPU_KEY_ALIAS }}
          SAPU_KEY_PASSWORD: ${{ secrets.SAPU_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon -q assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk"
          mkdir -p ../dist
          cp "$apk" ../dist/sapu-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*
  publish:
    needs: [build, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
  packaging:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: cli
          path: dist
      - name: Update Scoop manifest
        run: |
          cd dist && sha256sum * > SHA256SUMS && cd ..
          scripts/scoop-manifest.sh "${GITHUB_REF_NAME#v}" dist/SHA256SUMS > bucket/sapu.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add bucket/sapu.json
          git commit -m "scoop: ${GITHUB_REF_NAME}" && git push
      - name: Update Homebrew tap (depapp/homebrew-tap)
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret is not set; Formula/sapu.rb in depapp/homebrew-tap was not updated. Run: scripts/brew-formula.sh ${GITHUB_REF_NAME#v} SHA256SUMS > Formula/sapu.rb in that repo."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/depapp/homebrew-tap" "$RUNNER_TEMP/tap"
          scripts/brew-formula.sh "${GITHUB_REF_NAME#v}" dist/SHA256SUMS > "$RUNNER_TEMP/tap/Formula/sapu.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Formula/sapu.rb
          git commit -m "sapu ${GITHUB_REF_NAME}" && git push
